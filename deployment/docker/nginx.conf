server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA fallback: direct routes like /dashboard must return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the deployed backend.
    location /api/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/ai/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /files/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/files/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /product/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/product/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/ws/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_read_timeout 3600;
    }
}
