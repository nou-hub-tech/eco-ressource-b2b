<div style="padding:30px; max-width:600px; margin:auto;">
  <h2>🔍 Product Details</h2>

  <div *ngIf="product" style="border:1px solid #ddd; border-radius:8px; padding:20px; margin-top:20px;">

    <div style="text-align:center; margin-bottom:20px;">
      <img *ngIf="product.image"
           [src]="'http://localhost:8080/files/' + product.image"
           alt="product image"
           style="width:200px; height:200px; object-fit:cover; border-radius:8px; border:1px solid #ddd;">
      <div *ngIf="!product.image" style="color:#999;">No image available</div>
    </div>

    <table width="100%" style="border-collapse:collapse;">
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:10px; font-weight:bold; width:40%; color:#555;">ID</td>
        <td style="padding:10px;">{{ product.id_product }}</td>
      </tr>
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:10px; font-weight:bold; color:#555;">Name</td>
        <td style="padding:10px;">{{ product.name }}</td>
      </tr>
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:10px; font-weight:bold; color:#555;">Category</td>
        <td style="padding:10px;">{{ product.category }}</td>
      </tr>
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:10px; font-weight:bold; color:#555;">Material Type</td>
        <td style="padding:10px;">{{ product.materialType }}</td>
      </tr>
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:10px; font-weight:bold; color:#555;">Recyclable</td>
        <td style="padding:10px;">{{ product.recyclable ? '✅ Yes' : '❌ No' }}</td>
      </tr>
      <tr style="border-bottom:1px solid #eee;">
        <td style="padding:10px; font-weight:bold; color:#555;">Description</td>
        <td style="padding:10px;">{{ product.description }}</td>
      </tr>
    </table>

    <div style="margin-top:20px; display:flex; gap:10px;">
      <button (click)="back()"
              style="padding:8px 20px; background:#6c757d; color:white; border:none; border-radius:4px; cursor:pointer;">
        ⬅ Back
      </button>
      <button (click)="edit()"
              style="padding:8px 20px; background:#007bff; color:white; border:none; border-radius:4px; cursor:pointer;">
        ✏️ Update
      </button>
      <button (click)="delete()"
              style="padding:8px 20px; background:#dc3545; color:white; border:none; border-radius:4px; cursor:pointer;">
        🗑 Delete
      </button>
    </div>

  </div>

  <div *ngIf="!product" style="color:#999; margin-top:20px;">
    Loading...
  </div>
</div>
