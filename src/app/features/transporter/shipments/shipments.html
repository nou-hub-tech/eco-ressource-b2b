<div class="page-wrapper">
  <div class="page-header"><h1>Shipments</h1><p>Detailed view of all cargo and delivery assignments</p></div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="card" *ngFor="let s of shipments" style="padding:20px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <div>
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <code style="font-size:12px;color:var(--text3);font-weight:500">{{s.id}}</code>
            <span class="badge" [ngClass]="s.status==='delivered'?'badge-success':s.status==='in-transit'?'badge-info':'badge-warning'">{{s.status}}</span>
          </div>
          <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px">{{s.product}}</div>
          <div style="font-size:12px;color:var(--text3)">Client: {{s.client}}</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--accent)">{{s.earn}} TND</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">Earnings</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;padding:14px;background:var(--bg3,var(--bg2));border-radius:8px;border:1px solid var(--border);margin-bottom:14px">
        <div>
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-bottom:4px">Route</div>
          <div style="font-size:13px;font-weight:600;color:var(--text)">{{s.from}} → {{s.to}}</div>
        </div>
        <div>
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-bottom:4px">Pickup</div>
          <div style="font-size:13px;color:var(--text2)">{{s.pickup}}</div>
        </div>
        <div>
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-bottom:4px">Delivery</div>
          <div style="font-size:13px;color:var(--text2)">{{s.delivery}}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" *ngIf="s.status==='pickup'">Confirm Pickup</button>
        <button class="btn btn-primary btn-sm" *ngIf="s.status==='in-transit'">Mark Delivered</button>
        <button class="btn btn-outline btn-sm">QR Code</button>
        <button class="btn btn-ghost btn-sm">Contact Client</button>
      </div>
    </div>
  </div>
</div>
