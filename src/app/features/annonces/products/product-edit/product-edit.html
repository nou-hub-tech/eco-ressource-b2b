<div class="page-wrapper">
  <div class="pe-page">
    <a routerLink="/enterprise/annonces/products" class="btn btn-ghost btn-sm pe-back" *ngIf="loadError">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Retour à la liste
    </a>
    <a [routerLink]="['/enterprise/annonces/products', productId]" class="btn btn-ghost btn-sm pe-back" *ngIf="!loadError">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Retour au détail
    </a>

    <h1 class="pe-heading">Modifier le produit</h1>

    <div class="pe-loading" *ngIf="loading">
      <div class="spinner-lg"></div>
      <p>Chargement...</p>
    </div>

    <div class="empty-state" *ngIf="!loading && loadError">
      <span class="empty-icon">⚠️</span>
      <h3>{{ loadError }}</h3>
      <a class="btn btn-primary" routerLink="/enterprise/annonces/products">Retour à la liste</a>
    </div>

    <div class="pe-card card" *ngIf="!loading && !loadError" [formGroup]="form">
      <div class="form-group">
        <label for="pe-name">Nom du produit *</label>
        <input id="pe-name" type="text" formControlName="name" autocomplete="off">
        <div class="form-error" *ngIf="form.get('name')!.touched && form.get('name')!.hasError('required')">Le nom est obligatoire</div>
        <div class="form-error" *ngIf="form.get('name')!.hasError('minlength')">Le nom doit contenir au moins 2 caractères</div>
        <div class="form-error" *ngIf="form.get('name')!.hasError('maxlength')">Le nom ne peut pas dépasser 255 caractères</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="pe-category">Catégorie</label>
          <input id="pe-category" type="text" formControlName="category">
        </div>
        <div class="form-group">
          <label for="pe-material">Type de matériau</label>
          <input id="pe-material" type="text" formControlName="materialType">
        </div>
      </div>

      <div class="form-group">
        <label for="pe-desc">Description</label>
        <textarea id="pe-desc" formControlName="description" rows="4"></textarea>
        <div class="form-error" *ngIf="form.get('description')!.hasError('maxlength')">La description ne peut pas dépasser 1000 caractères</div>
      </div>

      <div class="form-group">
        <label for="pe-image">URL de l'image</label>
        <input id="pe-image" type="url" formControlName="image">
      </div>

      <div class="pe-toggle-row">
        <label class="pe-checkbox">
          <input type="checkbox" formControlName="recyclable">
          <span class="pe-checkbox-ui"></span>
          <span class="pe-checkbox-label">Produit recyclable</span>
        </label>
      </div>

      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

      <div class="pe-actions">
        <a [routerLink]="['/enterprise/annonces/products', productId]" class="btn btn-outline">Annuler</a>
        <button type="button" class="btn btn-primary" [disabled]="form.invalid || submitting" (click)="submit()">
          <span *ngIf="!submitting">Enregistrer</span>
          <span *ngIf="submitting" class="spinner-sm" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </div>
</div>
