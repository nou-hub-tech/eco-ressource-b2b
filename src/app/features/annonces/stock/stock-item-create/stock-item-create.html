<div class="page-wrapper">
  <div class="sic-page">
    <a routerLink="/enterprise/annonces/stock" class="btn btn-ghost btn-sm">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12" />
        <polyline points="12 19 5 12 12 5" />
      </svg>
      Retour au stock
    </a>

    <h1 class="sic-heading">Nouvel article en stock</h1>

    <div class="sic-loading" *ngIf="loadingProducts">
      <div class="spinner-lg"></div>
      <p>Chargement des produits…</p>
    </div>

    <div class="card sic-card" *ngIf="!loadingProducts" [formGroup]="form">
      <div class="form-row">
        <div class="form-group">
          <label>Quantité *</label>
          <input type="number" formControlName="quantity" min="0.0001" step="any" />
          <div class="form-error" *ngIf="form.get('quantity')!.touched && form.get('quantity')!.hasError('required')">
            La quantité est obligatoire.
          </div>
          <div class="form-error" *ngIf="form.get('quantity')!.touched && form.get('quantity')!.hasError('min')">
            La quantité doit être strictement positive.
          </div>
        </div>
        <div class="form-group">
          <label>Prix unitaire (TND) *</label>
          <input type="number" formControlName="unitPrice" min="0" step="0.01" />
          <div class="form-error" *ngIf="form.get('unitPrice')!.touched && form.get('unitPrice')!.hasError('required')">
            Le prix unitaire est obligatoire.
          </div>
          <div class="form-error" *ngIf="form.get('unitPrice')!.touched && form.get('unitPrice')!.hasError('min')">
            Le prix unitaire ne peut pas être négatif.
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Produit *</label>
        <select formControlName="idProduct">
          <option [ngValue]="null" disabled>— Choisir un produit —</option>
          <option *ngFor="let p of products" [ngValue]="p.idProduct">
            {{ p.name }}<span *ngIf="p.category"> ({{ p.category }})</span>
          </option>
        </select>
        <div class="form-error" *ngIf="form.get('idProduct')!.touched && form.get('idProduct')!.invalid">
          Veuillez sélectionner un produit.
        </div>
      </div>

      <div class="form-group">
        <label>ID entreprise</label>
        <input type="number" formControlName="companyId" min="1" placeholder="Optionnel" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>État / condition</label>
          <input type="text" formControlName="itemCondition" />
        </div>
        <div class="form-group">
          <label>Unité</label>
          <input type="text" formControlName="unit" placeholder="kg, pièce…" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date d’expiration</label>
          <input type="date" formControlName="expirationDate" />
        </div>
        <div class="form-group">
          <label>Statut</label>
          <input type="text" formControlName="status" />
        </div>
      </div>

      <div class="form-group">
        <label>Image (URL)</label>
        <input type="url" formControlName="image" placeholder="https://…" />
      </div>

      <div class="form-group">
        <label>Emplacement</label>
        <input type="text" formControlName="location" />
      </div>

      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

      <div class="sic-actions">
        <a routerLink="/enterprise/annonces/stock" class="btn btn-outline">Annuler</a>
        <button type="button" class="btn btn-primary" [disabled]="form.invalid || submitting" (click)="submit()">
          <span *ngIf="!submitting">Créer</span>
          <span *ngIf="submitting" class="spinner-sm"></span>
        </button>
      </div>
    </div>
  </div>
</div>
