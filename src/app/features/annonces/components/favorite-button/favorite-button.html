<button class="fav-btn" [class.active]="isFavorite" [class.loading]="loading" (click)="toggle($event)" [title]="isFavorite ? 'Retirer des favoris' : 'Ajouter aux favoris'">
  <svg width="18" height="18" viewBox="0 0 24 24" [attr.fill]="isFavorite ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
  </svg>
  <span class="fav-count" *ngIf="showCount && count > 0">{{count}}</span>
</button>
