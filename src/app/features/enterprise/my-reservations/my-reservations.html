<div class="page-wrapper">
  <div class="page-header-row">
    <div class="page-header" style="margin:0"><h1>My Reservations</h1><p>Manage your machine, space and material bookings</p></div>
    <button class="btn btn-primary" (click)="openModal()">+ New Reservation</button>
  </div>
  <div class="grid-2">
    <div class="card" *ngFor="let r of reservations" style="padding:18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <span class="badge badge-info">{{r.type}}</span>
        <span class="badge" [ngClass]="r.status==='confirmed'?'badge-success':'badge-warning'">{{r.status}}</span>
      </div>
      <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--text);margin-bottom:8px">{{r.item}}</div>
      <div style="display:flex;gap:16px;font-size:12px;color:var(--text3);margin-bottom:14px">
        <span>📅 {{r.from}}</span>
        <span>→ {{r.to}}</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--primary)">{{r.price}} TND</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-outline btn-sm">Details</button>
          <button class="btn btn-danger btn-sm">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  <div class="empty-state" *ngIf="reservations.length===0">
    <span class="empty-icon">🗓</span><h3>No reservations yet</h3><p>Book a machine or space from the marketplace</p>
  </div>
</div>
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header"><h2>New Reservation</h2><button class="btn btn-icon" (click)="closeModal()">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label>Type</label><select><option>Machine</option><option>Space</option><option>Material</option></select></div>
      <div class="form-group"><label>Item</label><input type="text" placeholder="Machine or space name"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>From</label><input type="date"></div>
      <div class="form-group"><label>To</label><input type="date"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="closeModal()">Reserve</button>
    </div>
  </div>
</div>
