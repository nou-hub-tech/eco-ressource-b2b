<div class="page-wrapper">
  <div class="page-header-row">
    <div class="page-header" style="margin:0"><h1>Marketplace</h1><p>Browse and purchase industrial surplus materials</p></div>
    <button class="btn btn-primary" (click)="openModal()">+ Post Listing</button>
  </div>
  <div class="toolbar">
    <div class="search-box"><span>🔍</span><input type="text" placeholder="Search materials..." [(ngModel)]="search"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button *ngFor="let c of categories" class="btn btn-sm" [class.btn-primary]="filterCat===c" [class.btn-outline]="filterCat!==c" (click)="filterCat=c">
        {{c==='all'?'All':c}}
      </button>
    </div>
    <div class="spacer"></div>
    <span class="toolbar-count">{{filtered.length}} listings</span>
  </div>

  <div class="grid-3">
    <div class="mkt-card" *ngFor="let l of filtered">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span class="badge badge-info" style="font-size:10px">{{l.category}}</span>
        <span class="badge badge-success">{{l.status}}</span>
      </div>
      <h3 style="font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px">{{l.title}}</h3>
      <p style="font-size:12px;color:var(--text3);margin-bottom:14px">{{l.company}}</p>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <span style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--primary)">{{l.price}} <span style="font-size:12px;font-weight:500;opacity:.7">TND</span></span>
        <span style="font-size:12px;color:var(--text3)">{{l.qty}}</span>
      </div>
      <div style="margin-bottom:14px"><span class="ai-tip">🤖 {{l.ai}}</span></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" style="flex:1;justify-content:center">Contact Seller</button>
        <button class="btn btn-outline btn-sm">Save</button>
      </div>
    </div>
  </div>

  <div class="empty-state" *ngIf="filtered.length===0">
    <span class="empty-icon">🏪</span><h3>No listings found</h3><p>Try a different search or category</p>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header"><h2>Post New Listing</h2><button class="btn btn-icon" (click)="closeModal()">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label>Title</label><input type="text" placeholder="e.g. Aluminum Scrap 2T"></div>
      <div class="form-group"><label>Category</label><select><option>Metal</option><option>Plastic</option><option>Paper</option><option>Glass</option><option>Textile</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Price (TND)</label><input type="number" placeholder="0"></div>
      <div class="form-group"><label>Quantity (kg)</label><input type="number" placeholder="0"></div>
    </div>
    <div class="form-group"><label>Description</label><textarea placeholder="Describe your surplus..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="closeModal()">Post Listing</button>
    </div>
  </div>
</div>
