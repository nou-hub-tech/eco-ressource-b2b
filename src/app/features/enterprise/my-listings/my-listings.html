<div class="page-wrapper">
  <div class="page-header-row">
    <div class="page-header" style="margin:0"><h1>My Listings</h1><p>Manage your posted surplus and materials</p></div>
    <button class="btn btn-primary" (click)="openModal()">+ New Listing</button>
  </div>
  <div class="grid-2" style="margin-bottom:20px">
    <div class="card" *ngFor="let l of listings" style="padding:18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div style="font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px">{{l.title}}</div>
          <div style="display:flex;gap:8px;align-items:center">
            <span class="badge badge-neutral">{{l.category}}</span>
            <span style="font-size:11px;color:var(--text3)">Posted {{l.posted}}</span>
          </div>
        </div>
        <span class="badge" [ngClass]="l.status==='active'?'badge-success':l.status==='pending'?'badge-warning':l.status==='draft'?'badge-neutral':'badge-danger'">{{l.status}}</span>
      </div>
      <div style="display:flex;gap:20px;margin-bottom:14px">
        <div>
          <div style="font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--primary)">{{l.price}} <span style="font-size:12px;font-weight:500;opacity:.6">TND</span></div>
          <div style="font-size:11px;color:var(--text3)">{{l.qty}}</div>
        </div>
        <div style="margin-left:auto;text-align:right">
          <div style="font-size:12px;color:var(--text3)">👁 {{l.views}} views</div>
          <div style="font-size:12px;color:var(--text2);font-weight:600;margin-top:2px">💬 {{l.enquiries}} enquiries</div>
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm">Edit</button>
        <button class="btn btn-primary btn-sm" *ngIf="l.status==='draft'">Publish</button>
        <button class="btn btn-danger btn-sm">Delete</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header"><h2>New Listing</h2><button class="btn btn-icon" (click)="closeModal()">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label>Title</label><input type="text" placeholder="e.g. Aluminum Scrap 2T"></div>
      <div class="form-group"><label>Category</label><select><option>Metal</option><option>Plastic</option><option>Paper</option><option>Glass</option><option>Textile</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Price (TND)</label><input type="number" placeholder="0"></div>
      <div class="form-group"><label>Quantity (kg)</label><input type="number" placeholder="0"></div>
    </div>
    <div class="form-group"><label>Description</label><textarea placeholder="Describe your surplus material..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="closeModal()">Save Draft</button>
      <button class="btn btn-primary" (click)="closeModal()">Publish Now</button>
    </div>
  </div>
</div>
