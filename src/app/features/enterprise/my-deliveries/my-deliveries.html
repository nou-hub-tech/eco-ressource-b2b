<div class="page-wrapper">
  <div class="page-header"><h1>My Deliveries</h1><p>Track all your shipments and logistics operations</p></div>
  <div class="card" style="padding:0">
    <table class="data-table">
      <thead><tr><th>ID</th><th>Product</th><th>Route</th><th>Transporter</th><th>CO₂ Saved</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
      <tbody>
        <tr *ngFor="let d of deliveries">
          <td><code style="font-size:11px;color:var(--text3)">{{d.id}}</code></td>
          <td><strong style="color:var(--text)">{{d.product}}</strong></td>
          <td style="color:var(--text2);font-size:12px">{{d.from}} → {{d.to}}</td>
          <td style="color:var(--text2)">{{d.transporter}}</td>
          <td><span style="color:var(--success,#059669);font-weight:600;font-size:12px">🌿 {{d.co2}}</span></td>
          <td><strong style="color:var(--primary)">{{d.amount}} TND</strong></td>
          <td><span class="badge" [ngClass]="d.status==='delivered'?'badge-success':d.status==='in-transit'?'badge-info':'badge-warning'">{{d.status}}</span></td>
          <td style="color:var(--text3);font-size:12px">{{d.date}}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
