<div class="page-wrapper">
  <div class="page-header-row">
    <div class="page-header" style="margin:0"><h1>Reservations & Orders</h1><p>Manage machine, space and material bookings</p></div>
    <button class="btn btn-primary" (click)="openModal()">+ New Reservation</button>
  </div>
  <div class="toolbar">
    <div class="search-box"><span>🔍</span><input type="text" placeholder="Search reservations..." [(ngModel)]="search"></div>
    <div class="spacer"></div>
    <span class="toolbar-count">{{filtered.length}} reservations</span>
  </div>
  <div class="card" style="padding:0">
    <table class="data-table">
      <thead><tr><th>ID</th><th>Type</th><th>Item</th><th>Company</th><th>Period</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let r of filtered">
          <td><code style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">{{r.id}}</code></td>
          <td><span class="badge badge-info">{{r.type}}</span></td>
          <td><strong style="color:var(--text)">{{r.item}}</strong></td>
          <td style="color:var(--text2)">{{r.company}}</td>
          <td style="font-size:12px;color:var(--text3)">{{r.from}} → {{r.to}}</td>
          <td><strong style="color:var(--primary)">{{r.price}} TND</strong></td>
          <td>
            <span class="badge" [ngClass]="r.status==='active'||r.status==='confirmed'?'badge-success':r.status==='pending'?'badge-warning':r.status==='completed'?'badge-neutral':'badge-danger'">{{r.status}}</span>
          </td>
          <td>
            <div style="display:flex;gap:6px">
              <button class="btn btn-outline btn-sm">View</button>
              <button class="btn btn-danger btn-sm">Cancel</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header"><h2>New Reservation</h2><button class="btn btn-icon" (click)="closeModal()">✕</button></div>
    <div class="form-row">
      <div class="form-group"><label>Type</label><select><option>Machine</option><option>Space</option><option>Material</option></select></div>
      <div class="form-group"><label>Item</label><input type="text" placeholder="Machine or space name"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>From</label><input type="date"></div>
      <div class="form-group"><label>To</label><input type="date"></div>
    </div>
    <div class="form-group"><label>Price (TND)</label><input type="number" placeholder="0"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="closeModal()">Create</button>
    </div>
  </div>
</div>
