<div class="page-wrapper">
  <div class="page-header-row">
    <div class="page-header" style="margin:0">
      <h1>Events & Campaigns</h1>
      <p>Browse and participate in B2B events and circular economy campaigns</p>
    </div>
    <button class="btn btn-primary" (click)="openModal()">+ Create Event</button>
  </div>
  <div class="grid-2">
    <div class="card" *ngFor="let e of events" style="padding:20px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <span class="badge badge-info">{{e.type}}</span>
        <span class="badge"
          [ngClass]="e.status==='upcoming'?'badge-primary':e.status==='ongoing'?'badge-success':'badge-neutral'">
          {{e.status}}
        </span>
      </div>
      <h3 style="font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:10px">
        {{e.title}}
      </h3>
      <div style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text3);margin-bottom:14px">
        <span>📅 {{e.date}}</span>
        <span>📍 {{e.location}}</span>
        <span>👥 {{e.participants}} participants</span>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm">View Details</button>
        <button class="btn btn-primary btn-sm" *ngIf="e.status!=='done'">Join Event</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Create Event</h2>
      <button class="btn btn-icon" (click)="closeModal()">✕</button>
    </div>
    <div class="form-group"><label>Event Title</label><input type="text" placeholder="Event name"></div>
    <div class="form-row">
      <div class="form-group"><label>Date</label><input type="date"></div>
      <div class="form-group"><label>Location</label><input type="text" placeholder="City"></div>
    </div>
    <div class="form-group"><label>Description</label><textarea placeholder="Describe the event..."></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-outline" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="closeModal()">Create</button>
    </div>
  </div>
</div>
