<div *ngIf="showModal" class="modal-overlay" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h4>
                <i class="bi bi-qr-code"></i> Commande #{{ order?.idDelivery }}
            </h4>
            <button class="btn-close" (click)="close()">×</button>
        </div>
        <div class="modal-body">
            <div *ngIf="order">
                
                <!-- Infos commande -->
                <div class="order-info">
                    <p><strong>Client:</strong> {{ order.nomClient }}</p>
                    <p><strong>Adresse:</strong> {{ order.adresseLivraison }}</p>
                    <p><strong>Statut:</strong>
                        <span [class]="getStatutClass(order.statut)">{{ order.statut }}</span>
                    </p>
                </div>

                <!-- QR CODE -->
                <div class="qr-section">
                    <p>📱 Scannez ce QR code avec votre téléphone:</p>
                    <img [src]="qrUrl" alt="QR Code" width="200" height="200" *ngIf="qrUrl" id="qrCodeImage">
                </div>

                <!-- Boutons Télécharger et Imprimer -->
                <div class="qr-buttons">
                    <button class="btn btn-primary" (click)="downloadQRCode()">
                        <i class="bi bi-download"></i> Télécharger QR code
                    </button>
                    <button class="btn btn-info" (click)="printQRCode()">
                        <i class="bi bi-printer"></i> Imprimer QR code
                    </button>
                </div>

                <div class="divider">— OU —</div>

                <!-- BOUTON DIRECT -->
                <div class="btn-section">
                    <button class="btn btn-success btn-block" (click)="confirmerLivraison()" [disabled]="isLoading">
                        <i class="bi bi-check-circle"></i>
                        {{ isLoading ? 'Chargement...' : '✅ CONFIRMER LA LIVRAISON' }}
                    </button>
                </div>

                <!-- Lien alternatif -->
                <div class="link-section">
                    <small>Ou cliquez sur le lien:</small>
                    <div class="link-box">
                        <input type="text" [value]="lienConfirmation" readonly>
                        <button class="btn btn-sm btn-outline-primary" (click)="copierLien()">Copier</button>
                    </div>
                </div>

                <div *ngIf="errorMessage" class="alert alert-danger mt-3">
                    {{ errorMessage }}
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" (click)="close()">Fermer</button>
        </div>
    </div>
</div>
