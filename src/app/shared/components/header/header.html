<header class="app-header">
  <div class="hdr-left">
    <button class="hdr-toggle" (click)="toggleSidebar.emit()">☰</button>
    <h2 class="hdr-title">{{pageTitle}}</h2>
  </div>

  <div class="hdr-right">
    <app-language-switcher></app-language-switcher>

    <!-- DARK MODE TOGGLE -->
    <button class="theme-toggle" (click)="toggleTheme()" [title]="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb">
          <span *ngIf="!isDark">☀️</span>
          <span *ngIf="isDark">🌙</span>
        </span>
      </span>
      <span class="theme-toggle-label">{{isDark ? 'Light Mode' : 'Dark Mode'}}</span>
    </button>

    <!-- NOTIFICATIONS -->
    <div style="position:relative">
      <button class="hdr-btn" (click)="showNotif = !showNotif">
        🔔
        <span class="hdr-notif-dot"></span>
      </button>
      <div class="notif-dropdown" *ngIf="showNotif">
        <div class="notif-head">
          <strong>Notifications</strong>
          <span class="badge badge-primary">{{notifications.length}} new</span>
        </div>
        <div class="notif-row" *ngFor="let n of notifications">
          <span class="notif-ico">{{n.icon}}</span>
          <div>
            <div class="notif-text">{{n.text}}</div>
            <div class="notif-time">{{n.time}}</div>
          </div>
        </div>
      </div>
    </div>

    <button class="hdr-btn">⚙</button>
    <div class="hdr-avatar" *ngIf="user">{{user.avatar}}</div>
  </div>
</header>
