<header class="app-header">
  <div class="hdr-left">
    <button class="hdr-toggle" (click)="toggleSidebar.emit()">&#9776;</button>
    <h2 class="hdr-title">{{pageTitle}}</h2>
  </div>

  <div class="hdr-right">
    <app-language-switcher></app-language-switcher>

    <button class="theme-toggle" (click)="toggleTheme()" [title]="isDark ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb">
          <span *ngIf="!isDark">&#9728;</span>
          <span *ngIf="isDark">&#9790;</span>
        </span>
      </span>
      <span class="theme-toggle-label">{{isDark ? 'Light Mode' : 'Dark Mode'}}</span>
    </button>

    <div style="position:relative">
      <button class="hdr-btn" (click)="showNotif = !showNotif" title="Notifications">
        &#128276;
        <span class="hdr-notif-dot" *ngIf="notifications.length"></span>
      </button>
      <div class="notif-dropdown" *ngIf="showNotif">
        <div class="notif-head">
          <strong>Notifications</strong>
          <span class="badge badge-primary">{{notifications.length}} new</span>
        </div>
        <div class="notif-row" *ngIf="notifications.length === 0">
          <span class="notif-ico">i</span>
          <div>
            <div class="notif-text">Aucune notification pour le moment</div>
            <div class="notif-time">Temps reel actif</div>
          </div>
        </div>
        <button type="button" class="notif-row notif-row-btn" *ngFor="let n of notifications" (click)="openNotification(n)">
          <span class="notif-ico">{{n.icon}}</span>
          <div>
            <div class="notif-text">{{n.text}}</div>
            <div class="notif-time">{{n.time}}</div>
          </div>
        </button>
      </div>
    </div>

    <button class="hdr-btn">&#9881;</button>
    <div class="hdr-avatar" *ngIf="user">{{user.avatar}}</div>
  </div>
</header>
