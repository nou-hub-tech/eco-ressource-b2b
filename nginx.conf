map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ai/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/ai/;
        proxy_ssl_server_name on;
        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /files/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/files/;
        proxy_ssl_server_name on;
        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /product/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/product/;
        proxy_ssl_server_name on;
        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass https://coastline-rumor-falcon.ngrok-free.dev/ws/;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host coastline-rumor-falcon.ngrok-free.dev;
        proxy_set_header ngrok-skip-browser-warning true;
        proxy_read_timeout 3600;
    }

}
